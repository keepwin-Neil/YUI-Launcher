<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-label="YUI Console Launcher"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfc"/>
      <stop offset="1" stop-color="#eaf3f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="24"
        stdDeviation="28"
        flood-color="#071029"
        flood-opacity="0.16"
      />
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect
    x="20"
    y="20"
    width="984"
    height="984"
    rx="204"
    fill="none"
    stroke="#cedbd6"
    stroke-width="8"
  />

  <g
    transform="translate(192 184) scale(10)"
    fill="none"
    stroke="#111a44"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  >
    <path d="M14 10v44l30-10V10H14Z" stroke-width="5"/>
  </g>

  <circle cx="302" cy="264" r="40" fill="#111a44"/>
  <circle cx="682" cy="704" r="40" fill="#111a44"/>
</svg>
